
name: Index docs in Cloudflare AI Search

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        type: choice
        default: reconcile
        options: [reconcile, sync, sync-and-prune]
  workflow_run:
    workflows: [pkgdown-gh-pages]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-search-indexing
  cancel-in-progress: false

jobs:
  index:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        vars.AI_SEARCH_AUTO_SYNC == 'true' &&
        github.event.workflow_run.conclusion == 'success'))

    permissions:
      contents: write
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev/ai-search

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pkgdown website
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: gh-pages
          path: dev/ai-search/site

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev/ai-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Restore AI Search manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash manifest-branch.sh restore

      - name: Sync Cloudflare AI Search
        id: sync
        timeout-minutes: 60
        run: |
          if [[ "$RECONCILE" == "true" ]]; then
            node sync.mjs site --reconcile
            exit $?
          fi
          args=(site --all-batches --recover-manifest)
          if [[ "$PRUNE" == "true" ]]; then
            args+=(--prune)
          fi
          node sync.mjs "${args[@]}"
        env:
          RECONCILE: ${{ inputs.mode == 'reconcile' }}
          PRUNE: ${{ github.event_name == 'workflow_run' || inputs.mode == 'sync-and-prune' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SEARCH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_SEARCH_MAX_UPLOADS: '5'

      - name: Save AI Search manifest
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') && hashFiles('dev/ai-search/manifest.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash manifest-branch.sh save

      - name: Install Cloudflare CLI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'reconcile' }}
        run: npm install --global cf@1.0.0-beta.27

      - name: Update AI Search assistant prompt
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'reconcile' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SEARCH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          prompt="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("settings.json", "utf8")).system_prompt_ai_search)')"
          cf ai-search update tidyterra-ai-search --namespace default --system-prompt-ai-search "$prompt"
