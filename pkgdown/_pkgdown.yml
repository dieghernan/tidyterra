template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: G-KRDM62G8K4
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image
  includes:
    in_header: |
      <script defer src="https://cloud.umami.is/script.js" data-website-id="c23b83bb-5f33-4256-a5b5-fbc59c1c7ae8"></script>
    before_body: |
      <chat-bubble-snippet
        api-url="https://ca9c109c-ee53-446c-a7fc-08328b87799b.search.ai.cloudflare.com/"
        placeholder="Ask about tidyterra..."
        chat-query-rewrite='{"enabled": false}'
      ></chat-bubble-snippet>
      <script type="module">
        import "https://ca9c109c-ee53-446c-a7fc-08328b87799b.search.ai.cloudflare.com/assets/v0.0.43/search-snippet.es.js";
        const chat = document.querySelector("chat-bubble-snippet");
        chat.translations = {
          chatTitle: "tidyterra AI (experimental)",
          openChatAriaLabel: "Ask tidyterra AI",
          chatEmptyTitle: "Ask about tidyterra",
          chatEmptyDescription: "Answers use the published tidyterra documentation and may contain mistakes. Check the linked sources. Questions are sent to Cloudflare for processing; do not include private data."
        };
        // Accessibility and viewport fixes for the pinned component version.
        const root = chat.shadowRoot;
        const bubble = root.querySelector(".bubble-button");
        const panel = root.querySelector(".chat-window");
        // Inline custom properties override the component's own theme defaults.
        const themeVariables = {
          "font-family": "var(--bs-body-font-family)",
          "font-family-mono": "var(--bs-font-monospace)",
          "line-height": "var(--bs-body-line-height)",
          "primary-color": "var(--bs-primary)",
          "primary-hover": "color-mix(in srgb, var(--bs-primary) 88%, var(--bs-body-color))",
          "background": "var(--bs-body-bg)",
          "surface": "var(--bs-tertiary-bg)",
          "text-color": "var(--bs-body-color)",
          "text-secondary": "var(--bs-secondary-color)",
          "text-description": "var(--bs-body-color)",
          "border-color": "var(--bs-border-color)",
          "border-radius": "var(--bs-border-radius-lg)",
          "hover-background": "var(--bs-secondary-bg)",
          "focus-ring": "var(--bs-focus-ring-color)",
          "error-color": "var(--bs-danger-text-emphasis)",
          "error-background": "var(--bs-danger-bg-subtle)",
          "user-message-bg": "var(--bs-primary)",
          "user-message-text": "var(--bs-white)",
          "assistant-message-bg": "var(--bs-tertiary-bg)",
          "assistant-message-text": "var(--bs-body-color)"
        };
        for (const [name, value] of Object.entries(themeVariables)) {
          chat.style.setProperty(`--search-snippet-${name}`, value);
        }
        chat.addEventListener("error", () => {
          let notice = root.querySelector(".tidyterra-chat-status");
          if (!notice) {
            notice = document.createElement("p");
            notice.className = "tidyterra-chat-status";
            notice.setAttribute("role", "status");
            panel.append(notice);
          }
          notice.textContent = "The assistant is temporarily unavailable. Please try again later or use the site search.";
        });
        const style = document.createElement("style");
        style.textContent = `
          .chat-window { width: min(380px, calc(100vw - 40px)); max-height: calc(100dvh - 40px); box-sizing: border-box; }
          .tidyterra-chat-status { padding: 8px 16px; margin: 0; font-size: 0.875rem; color: var(--search-snippet-text-color); }
          .chat-header-title, .chat-empty-title { font-family: var(--tidyterra-chat-heading-font); }
          .chat-message-bubble a, .powered-by a { color: var(--bs-link-color); }
          .chat-message-bubble a:hover, .powered-by a:hover { color: var(--bs-link-hover-color); }
          button:focus-visible, textarea:focus-visible { outline: 3px solid var(--bs-link-color); outline-offset: 2px; }
          @media (prefers-reduced-motion: reduce) {
            .bubble-button, .chat-window { transition: none; }
          }
        `;
        root.append(style);
        const syncPanel = () => {
          const open = panel.classList.contains("expanded");
          panel.inert = !open;
          for (const section of panel.children) {
            if (!section.classList.contains("chat-header")) {
              section.inert = !open || panel.classList.contains("minimized");
            }
          }
          bubble.inert = open;
          bubble.setAttribute("aria-expanded", String(open));
        };
        new MutationObserver(syncPanel).observe(panel, { attributes: true, attributeFilter: ["class"] });
        syncPanel();
        bubble.addEventListener("click", () => {
          syncPanel();
          root.querySelector("textarea")?.focus();
        });
        root.querySelector(".close-button").addEventListener("click", () => {
          syncPanel();
          bubble.focus();
        });
        chat.addEventListener("keydown", event => {
          if (event.key === "Escape" && panel.classList.contains("expanded")) {
            root.querySelector(".close-button").click();
            event.stopPropagation();
          }
        });
        const syncTheme = () => {
          chat.setAttribute("theme", document.documentElement.dataset.bsTheme || "auto");
          const heading = document.querySelector("h1") || document.body;
          chat.style.setProperty("--tidyterra-chat-heading-font", getComputedStyle(heading).fontFamily);
        };
        new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-bs-theme"] });
        syncTheme();
      </script>
 
home:
  title: >
    tidyterra | methods from tidyverse packages and ggplot2 helpers for Spat*
    objects

# Reference index convention:
# - Use `has_concept("<family>")` when a section maps to a roxygen `@family`.
# - Keep concept names aligned with `man/roxygen/meta.R`.
# - Use direct selectors only for pages without a family concept.
reference:
- title: "**tibble** methods"
  desc: >
    Methods from [**tibble**](https://CRAN.R-project.org/package=tibble)
    implemented for `Spat*` objects.
- contents:
  - has_concept("tibble.methods")

- title: "**dplyr** methods"
  desc: >
    Methods from [**dplyr**](https://CRAN.R-project.org/package=dplyr)
    implemented for `Spat*` objects.
- subtitle: Rows
  desc: |
    Verbs that mainly operate on rows.
- contents:
  - has_concept("dplyr.rows")
- subtitle: Columns
  desc: |
    Verbs that mainly operate on columns.
- contents:
  - has_concept("dplyr.cols")
- subtitle: Groups
  desc: |
    Verbs that mainly operate on groups of rows.
- contents:
  - has_concept("dplyr.groups")
- subtitle: "`SpatVector` and data frames"
  desc: >
    Verbs that mainly operate on pairs of `SpatVector` objects and data frames.
- contents:
  - has_concept("dplyr.pairs")

- title: "**tidyr** methods"
  desc: >
    Methods from [**tidyr**](https://CRAN.R-project.org/package=tidyr)
    implemented for `Spat*` objects.
- subtitle: Pivoting
  desc: >
    Pivoting methods for changing the representation of `SpatVector` objects
    without changing their geometries.
- contents:
  - has_concept("tidyr.pivot")
- subtitle: Rows
  desc: >
    Tools for duplicating `SpatVector` geometries.
- contents:
  - has_concept("tidyr.rows")
- subtitle: Missing values
  desc: >
    Tools for converting between implicit (absent rows) and explicit (`NA`)
    missing values and for handling explicit `NA` values.
- contents:
  - has_concept("tidyr.missing")
- subtitle: Character vectors
  desc: >
    Tools for working with character layers and attributes.
- contents:
  - has_concept("tidyr.character")
- subtitle: Nesting
  desc: >
    Tools for storing `SpatVector` objects in list-columns.
- contents:
  - has_concept("tidyr.nest")

- title: "**ggplot2** methods"
  desc: >
    Methods from [**ggplot2**](https://CRAN.R-project.org/package=ggplot2)
    implemented for `Spat*` objects.
- contents:
  - has_concept("ggplot2.methods")

- title: "**ggplot2** helpers"
- subtitle: Geoms and helpers
  desc: >
    Helpers for creating **ggplot2** layers from `Spat*` objects.
- contents:
  - has_concept("ggplot2.utils")
- subtitle: Scales
  desc: >
    Color scales, palettes and hypsometric tints for spatial plots.
- contents:
  - has_concept("gradients")

- title: "**generics** methods"
  desc: >
    Methods from [**generics**](https://CRAN.R-project.org/package=generics)
    implemented for `Spat*` objects.
- contents:
  - has_concept("generics.methods")

- title: Helpers
  desc: >
    Additional helper functions provided by **tidyterra**.
- subtitle: Coercing objects
  desc: >
    Convert `Spat*` objects to other object types or create `SpatRaster` objects
    from tibbles.
- contents:
  - has_concept("coerce")
- subtitle: Other helpers
  desc: >
    Utilities for CRS handling, package checks and `SpatRaster` comparisons.
- contents:
  - has_concept("helpers")

- title: Built-in data
  desc: >
    Example data and palette databases included with **tidyterra**.
- contents:
  - has_concept("datasets")

- title: About the package
- contents:
  - tidyterra-package

